# Using an environment name other than "base" is not recommended!
# Read https://github.com/mamba-org/micromamba-docker#multiple-environments
# if you must use a different environment name.
name: base
channels:
  - conda-forge
  - defaults
  - nvidia
  - pytorch
dependencies:
# base
  - python=3.8.19
# standard
  - numpy
  - matplotlib
  - plotly
  - seaborn
  - pandas
  - scikit-learn
  - tqdm
  - pip
  - jupyterlab
  - nb_conda_kernels
  - jupyter_contrib_nbextensions

# pytorch
  - pytorch::pytorch=2.4.1
  - pytorch::torchvision
  - pip:
    - torch_geometric
    - ray[tune]
    - torchrl==0.5.0
    - wandb
    - gym
    - ortools
    - imageio
    - kaleido>=0.2.1
    - pvlib


