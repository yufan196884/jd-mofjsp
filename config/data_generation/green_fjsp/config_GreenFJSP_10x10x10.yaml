##############################################################################
###                         Data generation                                ###
##############################################################################

# (R) [str] Type of your scheduling problem - this template is for jssp
sp_type: green_fjsp

# (O)   [string]  Filename under the generated data will be saved (subdirectory is chosen by sp_type)
instances_file: GreenFJSP_10x10x10_1000_instances.pkl

# (R)   [str] Environment you want to use to generate initial solution. The vanilla case is env_tetris_scheduling.
environment: None

# (O)   [int]     Seed for all pseudo random generators (random, numpy, torch)
seed: 0

jobs_config: {
  "min": 10,
  "mean": 10,
  "max": 10,
  "sigma": 3,
  "min_probability":0.01,
  "max_probability":0.01,
}

task_config: {
  "min": 10,
  "mean": 10,
  "max": 10,
  "sigma": 3,
  "min_probability":0.01,
  "max_probability":0.01,

}

machines_config: {
  "min": 10,
  "mean": 10,
  "max": 10,
  "sigma": 3,
  "min_probability":0.1,
  "max_probability":0.1,

}

# (R) [float] Probability of more than 1 machine
multi_machine_prob: 0.8

# (O) [list[int]] Duration of tasks are samples uniformly from this list
runtime_range: [100, 120]

# (R) [dict] Energy consumption (in KwH) generation parameters for each machine, for standby energy and running operations
Machine_Running_Consumption: {
  "min": 5,
  "mean": 20,
  "max": 50,
  "sigma": 10,
  "min_probability":0.01,
  "max_probability":0.01,
  "scaling_factor": 10.0
}

Machine_Standby_Consumption: {
  "min": 5,
  "mean": 20,
  "max": 50,
  "sigma": 10,
  "min_probability":0.01,
  "max_probability":0.01,
  "scaling_factor": 1.0
}


Solar_Power_Profile: {
  "target_month": 6
}

 
Energy_info: {
  "solar_peak_power": 186.0,
  "price_max_cap": 60.0,
  "forecast_horizon": 500,
  "loading_days": 5.0
}

# (R) [int] Number of instances (instances of the scheduling problem) to be generated
num_instances: 1000

# (O) [int] Number of parallel processes used to calculate the instances
num_processes: 16

# (O) [bool] Save the generated data in a file
write_to_file: True
